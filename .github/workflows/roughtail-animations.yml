name: One-time Roughtail Stingray animation replacement
on:
  push:
    branches: [main]
    paths:
      - 'Tools/RoughtailStingray/motion_payload.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 5.2.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          BLENDER=$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name blender | head -1)
          test -n "$BLENDER"
          "$BLENDER" --version | head -1
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
      - name: Export and verify unchanged static model
        shell: bash
        run: |
          set -euo pipefail
          cp Assets/_Game/Reef/Source/RoughtailStingray.fbx "$RUNNER_TEMP/original-stingray.fbx"
          "$BLENDER" --background ArtSources/RoughtailStingray.blend --python Tools/RoughtailStingray/apply_pending_actions.py
          "$BLENDER" --background ArtSources/RoughtailStingray.blend --python Tools/RoughtailStingray/export_stingray.py -- Assets/_Game/Reef/Source/RoughtailStingray.fbx
          "$BLENDER" --background --python Tools/RoughtailStingray/verify_export.py
          "$BLENDER" --background --python Tools/RoughtailStingray/verify_static_after_motion.py -- "$RUNNER_TEMP/original-stingray.fbx" Assets/_Game/Reef/Source/RoughtailStingray.fbx
      - name: Commit only both animation-bearing assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ArtSources/RoughtailStingray.blend Assets/_Game/Reef/Source/RoughtailStingray.fbx
          git rm -- Tools/RoughtailStingray/motion_payload.b64 Tools/RoughtailStingray/apply_pending_actions.py Tools/RoughtailStingray/verify_static_after_motion.py .github/workflows/roughtail-animations.yml
          git diff --cached --name-only
          git commit -m 'Replace Roughtail Stingray swimming and struggling animations only'
          git push origin HEAD:main
